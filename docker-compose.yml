services:
  phpbb:
    build:
      context: .
    ports:
      - "127.0.0.1:${PHPBB_HTTP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MASTERBB_HTTPS_MODE: ${MASTERBB_HTTPS_MODE:-auto}
      MASTERBB_TRUSTED_PROXIES: ${MASTERBB_TRUSTED_PROXIES:-}
      MASTERBB_PUBLIC_URL: ${MASTERBB_PUBLIC_URL:-}
      MASTERBB_SESSION_IDLE_SECONDS: ${MASTERBB_SESSION_IDLE_SECONDS:-3600}
      MASTERBB_SESSION_ABSOLUTE_SECONDS: ${MASTERBB_SESSION_ABSOLUTE_SECONDS:-86400}
      MASTERBB_PASSWORD_RESET_SECONDS: ${MASTERBB_PASSWORD_RESET_SECONDS:-3600}
      MASTERBB_HSTS_SECONDS: ${MASTERBB_HSTS_SECONDS:-0}
      MASTERBB_MAX_REQUEST_BYTES: ${MASTERBB_MAX_REQUEST_BYTES:-262144}
      MASTERBB_AUTH_WINDOW_SECONDS: ${MASTERBB_AUTH_WINDOW_SECONDS:-900}
      MASTERBB_AUTH_ACCOUNT_FAILURES: ${MASTERBB_AUTH_ACCOUNT_FAILURES:-5}
      MASTERBB_AUTH_NETWORK_FAILURES: ${MASTERBB_AUTH_NETWORK_FAILURES:-30}
      MASTERBB_TEST_MAIL_LOG: ${MASTERBB_TEST_MAIL_LOG:-}
    volumes:
      - phpbb-config:/var/lib/masterbb
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${MASTERBB_DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MASTERBB_DB_NAME:-phpbb}
      MARIADB_USER: ${MASTERBB_DB_USER:-phpbb}
      MARIADB_PASSWORD: ${MASTERBB_DB_PASSWORD:-phpbb}
    volumes:
      - phpbb-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  phpbb-db:
  phpbb-config:
